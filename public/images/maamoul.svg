<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1624"/>
      <stop offset="50%" stop-color="#522234"/>
      <stop offset="100%" stop-color="#2D0F1A"/>
    </linearGradient>
    <radialGradient id="sweetGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8B86D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8B86D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad2)"/>
  <circle cx="400" cy="300" r="230" fill="url(#sweetGlow2)"/>

  <!-- Maamoul Dome -->
  <g transform="translate(400, 290)">
    <ellipse cx="0" cy="40" rx="130" ry="70" fill="#B37D36" opacity="0.3"/>
    <!-- Dome Base -->
    <path d="M -110,20 C -110,-70 110,-70 110,20 C 110,60 -110,60 -110,20 Z" fill="#E8B86D" stroke="#C5A059" stroke-width="3"/>
    
    <!-- Traditional Carved Patterns -->
    <g stroke="#9C6B24" stroke-width="2.5" fill="none">
      <path d="M 0,-60 L 0,10"/>
      <path d="M -30,-50 L -15,10"/>
      <path d="M 30,-50 L 15,10"/>
      <path d="M -60,-30 L -40,15"/>
      <path d="M 60,-30 L 40,15"/>
      <circle cx="0" cy="-20" r="8"/>
      <circle cx="-35" cy="-10" r="6"/>
      <circle cx="35" cy="-10" r="6"/>
      <!-- Powdered sugar dust -->
      <circle cx="-15" cy="-35" r="3" fill="#FFF" stroke="none" opacity="0.7"/>
      <circle cx="20" cy="-25" r="2.5" fill="#FFF" stroke="none" opacity="0.8"/>
      <circle cx="5" cy="-5" r="2" fill="#FFF" stroke="none" opacity="0.7"/>
    </g>

    <!-- Date Filling Glimpse -->
    <path d="M -20,25 Q 0,15 20,25 Q 0,35 -20,25" fill="#42210B"/>
  </g>

  <!-- Title Badge -->
  <rect x="250" y="470" width="300" height="60" rx="16" fill="#FAF6F0" stroke="#C5A059" stroke-width="2"/>
  <text x="400" y="505" font-family="Arial, Tahoma, sans-serif" font-size="20" font-weight="bold" fill="#4A1D2E" text-anchor="middle">معمول التمر بالهيل والزعفران</text>
  <text x="400" y="522" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#C5A059" text-anchor="middle" letter-spacing="2">ROYAL DATE MAAMOUL</text>
</svg>

