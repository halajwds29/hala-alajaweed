<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1D2E"/>
      <stop offset="50%" stop-color="#682D43"/>
      <stop offset="100%" stop-color="#2D0F1A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6D32"/>
    </linearGradient>
    <radialGradient id="sweetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="400" cy="300" r="240" fill="url(#sweetGlow)"/>
  
  <!-- Geometric decorative plate -->
  <g stroke="#C5A059" stroke-width="1.5" opacity="0.3" fill="none">
    <circle cx="400" cy="300" r="210"/>
    <circle cx="400" cy="300" r="190" stroke-dasharray="6,6"/>
    <polygon points="400,110 590,300 400,490 210,300"/>
    <polygon points="400,130 570,300 400,470 230,300"/>
  </g>

  <!-- Baklava Diamonds -->
  <g transform="translate(400, 300)">
    <!-- Central Rhombus Plate -->
    <path d="M 0,-100 L 120,0 L 0,100 L -120,0 Z" fill="#E8B86D" stroke="#C5A059" stroke-width="4"/>
    <path d="M 0,-90 L 105,0 L 0,90 L -105,0 Z" fill="#D49B45"/>
    <path d="M 0,-80 L 90,0 L 0,80 L -90,0 Z" fill="#B87D28"/>

    <!-- Pistachio Green Crumbles -->
    <ellipse cx="0" cy="0" rx="40" ry="25" fill="#4E7C38"/>
    <circle cx="-15" cy="-8" r="6" fill="#71A848"/>
    <circle cx="12" cy="5" r="7" fill="#88C058"/>
    <circle cx="-5" cy="10" r="5" fill="#588D3A"/>
    <circle cx="20" cy="-6" r="5" fill="#71A848"/>

    <!-- Left & Right Pieces -->
    <path d="M -140,-50 L -60,-50 L -100,10 L -180,10 Z" fill="#D49B45" stroke="#C5A059" stroke-width="2"/>
    <ellipse cx="-120" cy="-20" rx="15" ry="10" fill="#588D3A"/>

    <path d="M 60,-50 L 140,-50 L 180,10 L 100,10 Z" fill="#D49B45" stroke="#C5A059" stroke-width="2"/>
    <ellipse cx="120" cy="-20" rx="15" ry="10" fill="#588D3A"/>
  </g>

  <!-- Title Badge -->
  <rect x="250" y="470" width="300" height="60" rx="16" fill="#FAF6F0" stroke="#C5A059" stroke-width="2"/>
  <text x="400" y="505" font-family="Arial, Tahoma, sans-serif" font-size="20" font-weight="bold" fill="#4A1D2E" text-anchor="middle">بقلاوة الأجاويد بالفستق</text>
  <text x="400" y="522" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#C5A059" text-anchor="middle" letter-spacing="2">PISTACHIO BAKLAVA</text>
</svg>

