<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1D2E"/>
      <stop offset="50%" stop-color="#5B2439"/>
      <stop offset="100%" stop-color="#2D0F1A"/>
    </linearGradient>
    <radialGradient id="kleichaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D99B4B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D99B4B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad3)"/>
  <circle cx="400" cy="290" r="230" fill="url(#kleichaGlow)"/>

  <!-- Hail Kleicha Round Puffed Pastry -->
  <g transform="translate(400, 280)">
    <!-- Shadow -->
    <ellipse cx="0" cy="50" rx="140" ry="60" fill="#200B13" opacity="0.4"/>
    <!-- Outer Crispy Rim -->
    <ellipse cx="0" cy="0" rx="130" ry="110" fill="#C48028" stroke="#9E5D12" stroke-width="4"/>
    <!-- Puffed Golden Dome -->
    <ellipse cx="0" cy="-5" rx="115" ry="95" fill="#E59E3F"/>
    
    <!-- Traditional Crosshatch Indentations -->
    <g stroke="#91520A" stroke-width="2.5" opacity="0.6">
      <path d="M -80,-40 L 80,40"/>
      <path d="M -60,-65 L 60,65"/>
      <path d="M -40,-80 L 40,80"/>
      <path d="M -80,40 L 80,-40"/>
      <path d="M -60,65 L 60,-65"/>
      <path d="M -40,80 L 40,-80"/>
    </g>

    <!-- Warm Spices & Black Lime Steam Essence -->
    <circle cx="0" cy="-5" r="45" fill="#B06A1A" opacity="0.4"/>
    <circle cx="20" cy="-20" r="10" fill="#7D4205" opacity="0.3"/>
  </g>

  <!-- Title Badge -->
  <rect x="250" y="470" width="300" height="60" rx="16" fill="#FAF6F0" stroke="#C5A059" stroke-width="2"/>
  <text x="400" y="505" font-family="Arial, Tahoma, sans-serif" font-size="20" font-weight="bold" fill="#4A1D2E" text-anchor="middle">كليجا حائل الأصيلة</text>
  <text x="400" y="522" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#C5A059" text-anchor="middle" letter-spacing="2">AUTHENTIC HAIL KLEICHA</text>
</svg>

