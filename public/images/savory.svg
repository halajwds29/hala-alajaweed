<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1D2E"/>
      <stop offset="100%" stop-color="#2D0F1A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad7)"/>
  <g transform="translate(400, 270)">
    <!-- Savory plate with mini pastries -->
    <ellipse cx="0" cy="50" rx="140" ry="40" fill="#000" opacity="0.4"/>
    <ellipse cx="0" cy="20" rx="130" ry="60" fill="#FAF6F0" stroke="#C5A059" stroke-width="2"/>
    <!-- Triangular savory samosa & rolls -->
    <polygon points="-50,-30 0,-70 30,-20" fill="#E59E3F" stroke="#B06A1A" stroke-width="2"/>
    <polygon points="10,-20 60,-50 80,-10" fill="#D49B45" stroke="#B06A1A" stroke-width="2"/>
    <ellipse cx="-40" cy="10" rx="25" ry="12" fill="#E8B86D" stroke="#B06A1A"/>
    <!-- Thyme / Zaatar specks -->
    <circle cx="-5" cy="-40" r="2" fill="#2E4A21"/>
    <circle cx="2" cy="-35" r="2.5" fill="#2E4A21"/>
    <circle cx="35" cy="-30" r="2" fill="#2E4A21"/>
  </g>
  <rect x="250" y="470" width="300" height="60" rx="16" fill="#FAF6F0" stroke="#C5A059" stroke-width="2"/>
  <text x="400" y="505" font-family="Arial, Tahoma, sans-serif" font-size="20" font-weight="bold" fill="#4A1D2E" text-anchor="middle">صواني الموالح والمقرمشات</text>
  <text x="400" y="522" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#C5A059" text-anchor="middle" letter-spacing="2">SAVORY PASTRIES TRAY</text>
</svg>

