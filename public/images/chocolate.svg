<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D111C"/>
      <stop offset="50%" stop-color="#4A1D2E"/>
      <stop offset="100%" stop-color="#1F0811"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad4)"/>

  <!-- Chocolate Squares & Pecan -->
  <g transform="translate(400, 270)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="80" rx="140" ry="40" fill="#000" opacity="0.4"/>
    
    <!-- Central Chocolate Block -->
    <path d="M -80,-40 L 40,-80 L 100,-20 L -20,20 Z" fill="#3D1C06" stroke="#C5A059" stroke-width="1.5"/>
    <path d="M -80,-40 L -20,20 L -20,70 L -80,10 Z" fill="#291102"/>
    <path d="M -20,20 L 100,-20 L 100,30 L -20,70 Z" fill="#4A240A"/>

    <!-- Crunchy caramel swirl -->
    <path d="M -50,-30 Q 10,-50 70,-30 Q 30,-15 -20,0" fill="none" stroke="#D99B4B" stroke-width="4"/>

    <!-- Pecan Nut on top -->
    <ellipse cx="10" cy="-35" rx="28" ry="16" fill="#8A4B1A" stroke="#5C300F" stroke-width="2"/>
    <path d="M -10,-35 L 30,-35" stroke="#4A240A" stroke-width="2"/>

    <!-- Gold Foil Sprinkle -->
    <polygon points="50,-40 55,-35 48,-33" fill="#C5A059"/>
    <polygon points="-40,-10 -35,-5 -42,-3" fill="#C5A059"/>
  </g>

  <!-- Title Badge -->
  <rect x="250" y="470" width="300" height="60" rx="16" fill="#FAF6F0" stroke="#C5A059" stroke-width="2"/>
  <text x="400" y="505" font-family="Arial, Tahoma, sans-serif" font-size="20" font-weight="bold" fill="#4A1D2E" text-anchor="middle">شوكولاتة كرانشي بالبيكان</text>
  <text x="400" y="522" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#C5A059" text-anchor="middle" letter-spacing="2">PECAN CRUNCHY CHOCOLATE</text>
</svg>

