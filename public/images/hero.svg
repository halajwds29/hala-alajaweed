<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1D2E"/>
      <stop offset="40%" stop-color="#682D43"/>
      <stop offset="100%" stop-color="#2D0F1A"/>
    </linearGradient>
    <radialGradient id="goldAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#heroBg)"/>
  <circle cx="500" cy="350" r="320" fill="url(#goldAmbient)"/>

  <!-- Arabesque Crest & Tray -->
  <g transform="translate(500, 320)">
    <!-- Ornate Golden Tray -->
    <ellipse cx="0" cy="80" rx="360" ry="120" fill="#200B13" opacity="0.5"/>
    <ellipse cx="0" cy="40" rx="340" ry="110" fill="#682D43" stroke="#C5A059" stroke-width="4"/>
    <ellipse cx="0" cy="35" rx="310" ry="95" fill="#FAF6F0"/>

    <!-- Sweets Assortment on Tray -->
    <!-- Baklava Triangles -->
    <path d="M -150,-10 L -90,-10 L -120,40 Z" fill="#D49B45" stroke="#9E5D12" stroke-width="2"/>
    <ellipse cx="-120" cy="5" rx="15" ry="8" fill="#588D3A"/>

    <path d="M -80,-10 L -20,-10 L -50,40 Z" fill="#D49B45" stroke="#9E5D12" stroke-width="2"/>
    <ellipse cx="-50" cy="5" rx="15" ry="8" fill="#588D3A"/>

    <!-- Center Kleicha Dome -->
    <ellipse cx="20" cy="20" rx="60" ry="45" fill="#E59E3F" stroke="#9E5D12" stroke-width="3"/>
    <circle cx="20" cy="20" r="20" fill="#B06A1A" opacity="0.4"/>

    <!-- Chocolate Squares -->
    <path d="M 100,-20 L 160,-20 L 180,30 L 120,30 Z" fill="#3D1C06" stroke="#C5A059" stroke-width="2"/>
    <ellipse cx="140" cy="5" rx="14" ry="8" fill="#8A4B1A"/>

    <path d="M 180,-10 L 230,-10 L 245,35 L 195,35 Z" fill="#4A240A" stroke="#C5A059" stroke-width="2"/>
  </g>

  <!-- Luxury Calligraphic Brand Seal -->
  <g transform="translate(500, 560)">
    <rect x="-240" y="-35" width="480" height="70" rx="20" fill="#FAF6F0" stroke="#C5A059" stroke-width="2.5"/>
    <text x="0" y="2" font-family="Arial, Tahoma, sans-serif" font-size="24" font-weight="900" fill="#4A1D2E" text-anchor="middle">حلا الأجاويد — ضيافة سعودية فاخرة</text>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#C5A059" text-anchor="middle" letter-spacing="3">HALA ALAJAWEED • SWEETS</text>
  </g>
</svg>

